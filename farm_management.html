<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub of Prosperity | Farm Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .management-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 100px);
        }

        .panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-green);
        }

        .inventory-item.low-stock {
            border-left-color: #ef4444;
        }

        .student-plot {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .student-plot h4 {
            margin: 0 0 10px 0;
            color: #fff;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 1s ease;
        }

        #mapView {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .telemetry-feed {
            font-family: monospace;
            background: #000;
            padding: 10px;
            border-radius: 4px;
            color: #4ade80;
            font-size: 12px;
        }
    </style>
    <!-- Mapbox GL / ArcGIS would go here, using a placeholder for now -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css">
    <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

    <nav class="app-nav">
        <a href="index.html">← Back to Main Dashboard</a>
        <a href="farm_management.html" class="active">Farm Management & Incubator</a>
        <a href="data_pipeline.html">Sensor Telemetry</a>
    </nav>

    <div class="management-grid">
        
        <!-- Left Panel: Inventory & Prosperity Pantry -->
        <div class="panel">
            <div class="panel-header">
                Prosperity Pantry Inventory
                <span style="font-size: 14px; color: #fff;">Target: $10,000 / yr</span>
            </div>
            <div id="inventoryContainer">
                <!-- Injected via JS -->
            </div>

            <div class="panel-header" style="margin-top: 30px;">
                Live Sensor Telemetry
                <span id="sensorStatus" style="font-size: 12px; color: #4ade80;">● Online</span>
            </div>
            <div class="telemetry-feed" id="telemetryOutput">
                Waiting for python pipeline data...
            </div>
        </div>

        <!-- Right Panel: Student Plots & Co-Op CSA -->
        <div class="panel">
            <div class="panel-header">
                Agroecology Co-op (Student Plots)
                <span style="font-size: 14px; color: #fff;">Active Students: 25</span>
            </div>
            
            <div id="mapView"></div>

            <div id="studentContainer">
                <!-- Injected via JS -->
            </div>
        </div>

    </div>

    <script src="farm_management.js"></script>
</body>
</html>
